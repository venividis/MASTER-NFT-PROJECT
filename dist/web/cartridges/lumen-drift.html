<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumen Drift · AWE</title><style>*{box-sizing:border-box}body{margin:0;background:#07121c;color:#d9ecfa;font:16px system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100vh;touch-action:none}header{position:fixed;left:22px;top:20px;pointer-events:none}header small{color:#80b7d6;font-size:12px;letter-spacing:.12em}h1{font-size:28px;margin:4px 0;font-weight:400}#score{position:fixed;right:24px;top:28px;font-size:28px;color:#a6e9ff}footer{position:fixed;bottom:20px;left:22px;right:22px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:#82b5cd}button{border:1px solid #4d8aa0;background:#10364a;color:#d8f5ff;padding:10px 16px;border-radius:4px;font:14px system-ui;cursor:pointer}#message{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%);text-align:center;font-size:24px;pointer-events:none;text-shadow:0 2px 20px #000}</style><canvas aria-label="Lumen Drift game field"></canvas><header><small>AWE / INDEPENDENT CARTRIDGE</small><h1>Lumen Drift</h1></header><div id="score">0</div><div id="message">Gather the light.<br><small>Move to begin</small></div><footer><span>Pointer / touch / arrow keys · avoid the amber satellites</span><button id="restart">Restart</button></footer><script>
(()=>{const c=document.querySelector('canvas'),g=c.getContext('2d'),scoreEl=document.querySelector('#score'),message=document.querySelector('#message');let w=innerWidth,h=innerHeight,d=devicePixelRatio||1,px=w/2,py=h/2,tx=px,ty=py,score=0,life=3,started=false,over=false,t=0,last=0,hurt=0;const keys=new Set;let stars=[],trails=[],seeds=[];function resize(){w=innerWidth;h=innerHeight;d=Math.min(devicePixelRatio||1,2);c.width=w*d;c.height=h*d;g.setTransform(d,0,0,d,0,0)}function rand(){return{x:45+Math.random()*(w-90),y:110+Math.random()*Math.max(60,h-200)}}function reset(){score=0;life=3;over=false;started=false;message.innerHTML='Gather the light.<br><small>Move to begin</small>';scoreEl.textContent='0';px=tx=w/2;py=ty=h/2;seeds=Array.from({length:9},rand);stars=Array.from({length:110},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.4+.3}));trails=[]}function begin(){if(!over){started=true;message.textContent=''}}function point(e){tx=e.clientX;ty=e.clientY;begin()}c.addEventListener('pointermove',point);c.addEventListener('pointerdown',point);window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();keys.add(e.key);begin()}});window.addEventListener('keyup',e=>keys.delete(e.key));document.querySelector('#restart').onclick=reset;window.addEventListener('resize',resize);resize();reset();function frame(now){let dt=Math.min((now-last)/1000,.04)||.016;last=now;t+=dt;g.fillStyle='rgba(7,18,28,.35)';g.fillRect(0,0,w,h);for(const s of stars){g.fillStyle=`rgba(133,197,223,${.18+.15*Math.sin(t+s.x)})`;g.beginPath();g.arc(s.x,s.y,s.r,0,7);g.fill()}const cx=w/2,cy=h/2;g.strokeStyle='#214258';g.lineWidth=1;for(let k=1;k<5;k++){g.beginPath();g.ellipse(cx,cy,Math.min(w,h)*(.13+k*.067),Math.min(w,h)*(.08+k*.048),-.35,0,7);g.stroke()}if(started&&!over){const v=250*dt;if(keys.has('ArrowLeft'))tx-=v;if(keys.has('ArrowRight'))tx+=v;if(keys.has('ArrowUp'))ty-=v;if(keys.has('ArrowDown'))ty+=v;tx=Math.max(15,Math.min(w-15,tx));ty=Math.max(75,Math.min(h-65,ty));px+=(tx-px)*Math.min(1,dt*9);py+=(ty-py)*Math.min(1,dt*9)}for(let i=0;i<seeds.length;i++){const s=seeds[i];g.save();g.translate(s.x,s.y);g.rotate(t*.5);g.shadowBlur=14;g.shadowColor='#8be8ff';g.fillStyle='#b5f0ff';g.beginPath();g.moveTo(0,-5);g.lineTo(4,0);g.lineTo(0,5);g.lineTo(-4,0);g.closePath();g.fill();g.restore();if(started&&!over&&Math.hypot(px-s.x,py-s.y)<19){score++;scoreEl.textContent=score;seeds[i]=rand();if(score>=30){over=true;message.innerHTML='Constellation complete.<br><small>30 lights gathered</small>'}}}for(let i=0;i<4;i++){const a=t*(.5+i*.11)+i*1.6,r=Math.min(w,h)*(.15+i*.06),x=cx+Math.cos(a)*r*1.2,y=cy+Math.sin(a)*r*.8;g.shadowBlur=16;g.shadowColor='#ffb15d';g.fillStyle='#e6a35c';g.beginPath();g.arc(x,y,7+i,0,7);g.fill();g.shadowBlur=0;if(started&&!over&&now>hurt&&Math.hypot(px-x,py-y)<20+i){life--;hurt=now+1300;if(!life){over=true;message.innerHTML='The light rests.<br><small>Restart to try another path</small>'}}}g.fillStyle=now<hurt?'#f4d295':'#a9f1fc';g.shadowColor='#8dd7ff';g.shadowBlur=20;g.beginPath();g.arc(px,py,6,0,7);g.fill();g.shadowBlur=0;g.fillStyle='#83bad0';g.font='14px system-ui';g.fillText('◦ '.repeat(life),w-75,76);requestAnimationFrame(frame)}requestAnimationFrame(frame);window.addEventListener('message',e=>{if(e.source!==parent||e.data?.type!=='awe:connected'||!e.ports[0])return;const p=e.ports[0];p.postMessage({id:'lumen-info',session:e.data.session,method:'console.info'})});parent.postMessage({type:'awe:hello',version:1},'*')})();
</script></html>
